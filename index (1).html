<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Details</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.box{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

/* Instagram-style logo */
.instagram-logo{
    width:75px;
    height:75px;
    margin:0 auto 15px;
    border-radius:22px;
    background:linear-gradient(
        135deg,
        #833ab4,
        #c13584,
        #e1306c,
        #fd1d1d,
        #fcb045
    );
    position:relative;
}

.instagram-logo::before{
    content:"";
    position:absolute;
    width:38px;
    height:38px;
    border:4px solid white;
    border-radius:12px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.instagram-logo::after{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;
    right:17px;
    top:17px;
}

.instagram-camera{
    position:absolute;
    width:13px;
    height:13px;
    border:3px solid white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

h1{
    text-align:center;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#667eea;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

#ownerLogin,
#ownerPanel{
    display:none;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.data{
    background:#f2f2f2;
    padding:15px;
    margin-top:12px;
    border-radius:10px;
}

.back{
    background:#555;
}

.logout{
    background:#d9534f;
}
</style>
</head>

<body>

<!-- MAIN PAGE -->
<div class="box" id="mainPage">

    <div class="instagram-logo">
        <div class="instagram-camera"></div>
    </div>

    <h1>Instagram user</h1>

    <label>User Name</label>
    <input
        type="text"
        id="usernameInput"
        placeholder="Enter user name"
    >

    <label>Password</label>
    <input
        type="password"
        id="userPasswordInput"
        placeholder="Enter password"
    >

    <button type="button" id="submitBtn">
        Submit
    </button>

    <button type="button" id="ownerBtn">
        Owner Panel
    </button>

    <div class="message" id="mainMessage"></div>

</div>


<!-- OWNER LOGIN -->
<div class="box" id="ownerLogin">

    <h1>Owner Login</h1>

    <input
        type="password"
        id="ownerPasswordInput"
        placeholder="Enter owner password"
    >

    <button type="button" id="loginBtn">
        Login
    </button>

    <button type="button" class="back" id="backBtn">
        Back
    </button>

    <div class="message" id="loginMessage"></div>

</div>


<!-- OWNER PANEL -->
<div class="box" id="ownerPanel">

    <h1>Owner Panel</h1>

    <div class="data">
        <b>User Name:</b>
        <div id="showUserName"></div>
    </div>

    <div class="data">
        <b>Password:</b>
        <div>••••••••</div>
    </div>

    <button type="button" class="logout" id="logoutBtn">
        Logout
    </button>

</div>


<script>

const OWNER_PASSWORD = "1572";

const submitBtn = document.getElementById("submitBtn");
const ownerBtn = document.getElementById("ownerBtn");
const loginBtn = document.getElementById("loginBtn");
const backBtn = document.getElementById("backBtn");
const logoutBtn = document.getElementById("logoutBtn");


// Submit
submitBtn.addEventListener("click", function(){

    const username =
        document.getElementById("usernameInput").value.trim();

    const password =
        document.getElementById("userPasswordInput").value.trim();

    const msg =
        document.getElementById("mainMessage");

    if(username === "" || password === ""){
        msg.style.color = "red";
        msg.innerText = "Please enter both details!";
        return;
    }

    // Only save the username.
    localStorage.setItem("username", username);
    localStorage.setItem("submitted", "yes");

    msg.style.color = "green";
    msg.innerText = "✓ Submitted successfully!";

    document.getElementById("usernameInput").value = "";
    document.getElementById("userPasswordInput").value = "";
});


// Owner Panel
ownerBtn.addEventListener("click", function(){

    if(localStorage.getItem("submitted") !== "yes"){

        document.getElementById("mainMessage").style.color = "red";

        document.getElementById("mainMessage").innerText =
            "First submit the details!";

        return;
    }

    document.getElementById("mainPage").style.display = "none";
    document.getElementById("ownerLogin").style.display = "block";
});


// Owner Login
loginBtn.addEventListener("click", function(){

    const password =
        document.getElementById("ownerPasswordInput").value;

    if(password === OWNER_PASSWORD){

        document.getElementById("ownerLogin").style.display = "none";
        document.getElementById("ownerPanel").style.display = "block";

        document.getElementById("showUserName").innerText =
            localStorage.getItem("username");

    }else{

        document.getElementById("loginMessage").style.color = "red";

        document.getElementById("loginMessage").innerText =
            "Wrong password!";

    }
});


// Back
backBtn.addEventListener("click", function(){

    document.getElementById("ownerLogin").style.display = "none";
    document.getElementById("mainPage").style.display = "block";

});


// Logout
logoutBtn.addEventListener("click", function(){

    document.getElementById("ownerPanel").style.display = "none";
    document.getElementById("mainPage").style.display = "block";

});

</script>

</body>
</html>
